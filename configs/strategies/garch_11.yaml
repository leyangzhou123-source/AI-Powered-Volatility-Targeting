name: garch_11
data:
  symbol: ES.v.0
  source: local_csv
target_vol: 0.1
rebalance_freq: daily
weight_min: 0.0
weight_max: 1.5
cost_bps: 5.0
vol_ann: 252
router:
  enabled: true
  default_pair: garch_11__naive_scaling
  params:
    sticky_period: 5
    min_performance_obs: 20
    use_perf_weight: true
  pairs:
