name: usdt_crypto_ai_regime_router
description: AI-regime router over USDTUSD crypto volatility pairs
data:
  symbol: USDTUSD
  path: data/processed/USDTUSD_daily.parquet
  date_col: date
  returns_col: log_return
  price_col: close
intraday_realized_vol:
  enabled: true
  path: data/processed/USDTUSD_intraday_volatility.parquet
  lookback: 21
pair_history_features:
  enabled: true
  path: results/crypto_usdt_vol_pairs_oss20b
  benchmark_path: results/crypto_usdt_vol_pairs_oss20b/usdt_realized_vol_20d__naive_scaling.parquet
  lookbacks:
  - 10
  - 30
  - 90
target_vol: 0.02
rebalance_freq: daily
roll_window: 90
weight_min: 0.0
weight_max: 2.0
cost_bps: 2.0
vol_ann: 365
router:
  enabled: true
  type: ai_regime
  class: src.crypto_router.ai_vol_target_router.CryptoVolTargetAIRouter
  params:
    provider: nvidia
    model: openai/gpt-oss-20b
    api_format: chat_completions
    api_key: ${NVAPI_KEY}
    ai_enabled: true
    fail_open: true
    precomputed_ai_regime_path: ''
    precomputed_ai_regime_only: false
    max_ai_regime_calls: 100000
    max_ai_selection_calls: 100000
    max_total_ai_calls: 100000
    ai_regime_interval: 20
    ai_selection_interval: 20
    candidate_top_n: 10
    sensitiveness: high
    sticky_period: 20
    perf_weight: 1.5
    lambda_drawdown: 0.5
    lambda_switch: 0.15
    lambda_invalid: 2.0
    lambda_exception: 1.0
    use_heuristic_regime_bias: false
    regime_bias_weight: 3.0
    max_output_tokens: 0
    switch_decision_max_output_tokens: 0
    selection_max_output_tokens: 0
    timeout: 60.0
    request_min_interval_seconds: 0.0
    target_vol: 0.02
    ann_factor: 365.0
    asset_label: USDT
    train_candidate_filter_enabled: true
    train_candidate_pool_size: 30
    initial_pair_rule: train_shape
    deterministic_switch_decision: false
    deterministic_pair_selection: false
  pairs:
  - name: usdt_crypto_intraday_rv_1d__naive_scaling
    estimator:
      class: src.crypto_router.estimators.IntradayRealizedVolEstimator
      params:
        lookback: 1
        fallback_lookback: 20
        vol_ann: 365
        path: data/processed/USDTUSD_intraday_volatility.parquet
    controller:
      class: src.controllers.naive_scaling.NaiveScaling
      params: {}
  - name: usdt_crypto_intraday_rv_1d__hysteresis
    estimator:
      class: src.crypto_router.estimators.IntradayRealizedVolEstimator
      params:
        lookback: 1
        fallback_lookback: 20
        vol_ann: 365
        path: data/processed/USDTUSD_intraday_volatility.parquet
    controller:
      class: src.controllers.hysteresis_controller.HysteresisController
      params:
        deadband: 0.025
        w_min: 0.0
        w_max: 2.0
  - name: usdt_crypto_intraday_rv_1d__vol_target_clip
    estimator:
      class: src.crypto_router.estimators.IntradayRealizedVolEstimator
      params:
        lookback: 1
        fallback_lookback: 20
        vol_ann: 365
        path: data/processed/USDTUSD_intraday_volatility.parquet
    controller:
      class: src.controllers.vol_target_clip.VolTargetClip
      params:
        w_min: 0.0
        w_max: 2.0
        rebalance_threshold: 0.025
  - name: usdt_crypto_intraday_rv_1d__variance_scaling
    estimator:
      class: src.crypto_router.estimators.IntradayRealizedVolEstimator
      params:
        lookback: 1
        fallback_lookback: 20
        vol_ann: 365
        path: data/processed/USDTUSD_intraday_volatility.parquet
    controller:
      class: src.controllers.variance_scaling.VarianceScaling
      params:
        sigma_bar_window: 90
        no_trade_band: 0.025
  - name: usdt_crypto_intraday_rv_1d__drawdown_brake
    estimator:
      class: src.crypto_router.estimators.IntradayRealizedVolEstimator
      params:
        lookback: 1
        fallback_lookback: 20
        vol_ann: 365
        path: data/processed/USDTUSD_intraday_volatility.parquet
    controller:
      class: src.controllers.drawdown_brake.DrawdownBrake
      params: {}
  - name: usdt_crypto_intraday_rv_1d__drawdown_modulated
    estimator:
      class: src.crypto_router.estimators.IntradayRealizedVolEstimator
      params:
        lookback: 1
        fallback_lookback: 20
