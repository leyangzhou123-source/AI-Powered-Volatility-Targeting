name: static_weighted_ensemble

data:
  path: data/processed/ES_Daily_Processed.parquet

target_vol: 0.10
rebalance_freq: daily
roll_window: 252
weight_min: 0.0
weight_max: 1.5
cost_bps: 5.0
vol_ann: 252

estimator:
  class: src.ensemble.static_weighted_ensemble.StaticWeightedEnsemble
  params:
    name: static_weighted_ensemble
    estimators: [ewma, har_rv, garch_11, realized_vol]
    min_obs: 120
    returns_col: returns_clean
    weight_method: inverse_qlike   # manual | inverse_mse | inverse_qlike
    manual_weights:
      ewma: 0.25
      har_rv: 0.25
      garch_11: 0.25
      realized_vol: 0.25
    rv_window: 21
    train_start: null
    train_end: null
    estimator_params:
      ewma:
        halflife: 20
        vol_ann: 252
      har_rv:
        returns_col: returns_clean
        vol_ann: 252
      garch_11:
        p: 1
        q: 1
        vol_ann: 252
      realized_vol:
        lookback: 20
        vol_ann: 252

controller:
  class: src.controllers.naive_scaling.NaiveScaling
  params: {}
