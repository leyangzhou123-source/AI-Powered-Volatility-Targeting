name: ewma_priority_stack_router
description: EWMA estimator with router switching across production-style controllers
data:
  symbol: SPY
  source: databento
  price_col: close
router:
  enabled: true
  default_pair: ewma_priority_stack_router__naive_scaling
  params:
    sticky_period: 5
    min_performance_obs: 20
    use_perf_weight: true
  pairs:
  - name: ewma_priority_stack_router__naive_scaling
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.naive_scaling.NaiveScaling
      params: {}
  - name: ewma_priority_stack_router__constant_weight
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.constant_weight.ConstantWeight
      params: {}
  - name: ewma_priority_stack_router__variance_scaling
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.variance_scaling.VarianceScaling
      params: {}
  - name: ewma_priority_stack_router__regime_switch
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.regime_controller.RegimeSwitchController
      params: {}
  - name: ewma_priority_stack_router__vol_target_clip
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.vol_target_clip.VolTargetClip
      params: {}
  - name: ewma_priority_stack_router__drawdown_brake
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.drawdown_brake.DrawdownBrake
      params: {}
  - name: ewma_priority_stack_router__trend_filter
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.trend_filter.TrendFilter
      params: {}
  - name: ewma_priority_stack_router__cvar_es_targeting
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.cvar_es_targeting.CVaRESTargeting
      params: {}
  - name: ewma_priority_stack_router__hysteresis
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.hysteresis_controller.HysteresisController
      params: {}
  - name: ewma_priority_stack_router__priority_stack
    estimator:
      class: src.estimators.ewma.EWMA
      params:
        halflife: 20
        vol_ann: 252
    controller:
      class: src.controllers.priority_stack_controller.PriorityStackController
      params: {}
target_vol: 0.1
rebalance_freq: daily
roll_window: 252
weight_min: 0.0
weight_max: 1.5
cost_bps: 5.0
vol_ann: 252
