name: buy_and_hold
data:
  symbol: ES.v.0
  source: local_csv
target_vol: 0.1
rebalance_freq: daily
weight_min: 1.0
weight_max: 1.0
cost_bps: 0.0
vol_ann: 252
router:
  enabled: true
  default_pair: buy_and_hold__naive_scaling
  params:
    sticky_period: 5
    min_performance_obs: 20
    use_perf_weight: true
  pairs:
  - name: buy_and_hold__naive_scaling
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.naive_scaling.NaiveScaling
      params: {}
  - name: buy_and_hold__constant_weight
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.constant_weight.ConstantWeight
      params: {}
  - name: buy_and_hold__variance_scaling
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.variance_scaling.VarianceScaling
      params: {}
  - name: buy_and_hold__regime_switch
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.regime_controller.RegimeSwitchController
      params: {}
  - name: buy_and_hold__vol_target_clip
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.vol_target_clip.VolTargetClip
      params: {}
  - name: buy_and_hold__drawdown_brake
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.drawdown_brake.DrawdownBrake
      params: {}
  - name: buy_and_hold__trend_filter
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.trend_filter.TrendFilter
      params: {}
  - name: buy_and_hold__cvar_es_targeting
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.cvar_es_targeting.CVaRESTargeting
      params: {}
  - name: buy_and_hold__hysteresis
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.hysteresis_controller.HysteresisController
      params: {}
  - name: buy_and_hold__priority_stack
    estimator:
      class: src.estimators.BuyAndHold
      params:
        target_vol: 0.1
    controller:
      class: src.controllers.priority_stack_controller.PriorityStackController
      params: {}
