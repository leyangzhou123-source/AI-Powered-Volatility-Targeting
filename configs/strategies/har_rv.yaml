        ann_factor: 252
    controller:
      class: src.controllers.trend_filter.TrendFilter
      params: {}
  - name: har_rv__cvar_es_targeting
    estimator:
      class: src.estimators.HARRV
      params:
        returns_col: asset_returns
        w_lookback: 5
        m_lookback: 22
        min_obs: 80
        ridge_lambda: 1e-6
        ann_factor: 252
    controller:
      class: src.controllers.cvar_es_targeting.CVaRESTargeting
      params: {}
  - name: har_rv__hysteresis
    estimator:
