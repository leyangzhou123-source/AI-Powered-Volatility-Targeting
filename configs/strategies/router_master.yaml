name: router_master
description: Master mixture-of-experts router over all successful estimator/controller pairs from manifest.csv
data:
  symbol: SPY
  source: databento
  price_col: close
target_vol: 0.1
rebalance_freq: daily
roll_window: 252
weight_min: 0.0
weight_max: 1.5
cost_bps: 5.0
vol_ann: 252
router:
  enabled: true
  type: mixture_of_experts
  default_pair: ewma__constant_weight
  params:
    excluded_estimators:
    - lasso
    - wavelet
    - buy_and_hold
    - buyandhold
    excluded_controllers:
    - constant
    - cvar
    - cvares
    - cva_res
    sticky_period: 5
    min_performance_obs: 5
    use_perf_weight: true
    temperature: 0.2
    momentum: 0.25
    switch_margin: 0.0
    score_clip: 10.0
    include_regime_bias: true
    lambda_risk: 2.0
    lambda_cost: 0.4
    lambda_vol_tracking: 2.0
    lambda_estimator_loss: 0.25
    lambda_invalid: 2.0
    lambda_exception: 1.0
    lambda_diag: 1.0
    lambda_switch: 0.25
    max_invalid_rate: 0.25
    max_exception_rate: 0.1
  pairs:
  - name: ar1__constant_weight
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.constant_weight.ConstantWeight
      params:
        weight: 1.0
  - name: ar1__cva_restargeting
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.cvar_es_targeting.CVaRESTargeting
      params: {}
  - name: ar1__drawdown_brake
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.drawdown_brake.DrawdownBrake
      params: {}
  - name: ar1__drawdown_modulated_controller
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.drawdown_modulated.DrawdownModulatedController
      params: {}
  - name: ar1__hysteresis_controller
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.hysteresis_controller.HysteresisController
      params: {}
  - name: ar1__naive_scaling
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.naive_scaling.NaiveScaling
      params: {}
  - name: ar1__priority_stack_controller
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.priority_stack_controller.PriorityStackController
      params: {}
  - name: ar1__regime_switch_controller
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.regime_controller.RegimeSwitchController
      params: {}
  - name: ar1__trend_filter
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
      class: src.controllers.trend_filter.TrendFilter
      params: {}
  - name: ar1__variance_scaling
    estimator:
      class: src.estimators.ar1.AR1
      params:
        vol_ann: 252
    controller:
