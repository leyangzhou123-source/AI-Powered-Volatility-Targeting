name: wavelet
data:
  symbol: ES.v.0
  source: local_csv
target_vol: 0.1
rebalance_freq: daily
weight_min: 0.0
weight_max: 1.5
cost_bps: 5.0
vol_ann: 252
router:
  enabled: true
  default_pair: wavelet__naive_scaling
  params:
    sticky_period: 5
    min_performance_obs: 20
    use_perf_weight: true
  pairs:
  - name: wavelet__naive_scaling
    estimator:
      class: src.estimators.WaveletVolatility
      params:
        wavelet: db4
        level: 2
        threshold_mode: soft
        vol_window: 22
        vol_ann: 252
        min_obs: 30
        fallback: rv
    controller:
      class: src.controllers.naive_scaling.NaiveScaling
      params: {}
  - name: wavelet__constant_weight
    estimator:
      class: src.estimators.WaveletVolatility
      params:
        wavelet: db4
        level: 2
        threshold_mode: soft
        vol_window: 22
        vol_ann: 252
        min_obs: 30
        fallback: rv
    controller:
      class: src.controllers.constant_weight.ConstantWeight
      params: {}
  - name: wavelet__variance_scaling
