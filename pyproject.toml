[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voltarget"
version = "0.1.0"
description = "Volatility targeting strategies for systematic portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "UIUC Practicum Team" }
]
keywords = ["volatility", "targeting", "quantitative", "finance", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "python-dotenv>=1.0",
    "jupyter>=1.0",
    "ipykernel>=6.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
]
ar = [
    "statsmodels>=0.14",
]
garch = [
    "arch>=6.0",
]
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]
hmm = [
    "hmmlearn>=0.3",
]
databento = [
    "databento>=0.20",
]
all = [
    "voltarget[dev,ar,garch,ml,hmm,databento]",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/configs",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "arch.*",
    "hmmlearn.*",
    "lightgbm.*",
    "databento.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
